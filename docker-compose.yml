# Dev app only. Postgres is not bundled — set connectors in `.env`.
# See docs/DEVELOPMENT.md.

services:
  app:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-}
      NODE_ENV: development
      # First Admin when `users` is empty. No demo projects or cases.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@opentcm.io}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-opentcm-admin}
      HTTPS: ${HTTPS:-false}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run db:migrate:prod && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  app_node_modules:
