services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: opentcm
      POSTGRES_PASSWORD: opentcm
      POSTGRES_DB: opentcm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentcm -d opentcm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://opentcm:opentcm@postgres:5432/opentcm
      NODE_ENV: development
      # First Admin when `users` is empty. No demo projects or cases.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@opentcm.io}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-opentcm-admin}
      HTTPS: ${HTTPS:-false}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm ci && npm run db:migrate:prod && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  postgres_data:
  app_node_modules:
