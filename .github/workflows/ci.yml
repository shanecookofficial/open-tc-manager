name: CI

on:
  push:
    branches:
      - main
      - plan
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opentcm
          POSTGRES_PASSWORD: opentcm
          POSTGRES_DB: opentcm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opentcm -d opentcm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://opentcm:opentcm@localhost:5432/opentcm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
